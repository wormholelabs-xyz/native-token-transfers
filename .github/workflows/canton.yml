name: Canton CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./canton

jobs:
  daml:
    name: dpm build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # dpm is Digital Asset's Daml package manager. There is no official
      # published GitHub Action for it yet; the install step below uses the
      # canonical installer and pins the SDK version declared in every
      # daml.yaml (sdk-version: 3.5.1). CONFIRM the installer URL/pin with the
      # toolchain owner before enabling required checks (see the DAR-release
      # ownership open question, canton/dars/README.md). The Daml source builds
      # against the vendored wormhole-core DAR — this job never rebuilds core.
      - name: Install dpm
        run: |
          curl -sSfL https://docs.digitalasset.com/dpm/install.sh | sh
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Install SDK
        run: dpm install 3.5.1

      - name: Build all Canton packages
        run: dpm build --all

      - name: Run Daml tests
        working-directory: ./canton/test
        run: dpm test
