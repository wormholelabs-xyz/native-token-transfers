name: Canton CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: ./canton

jobs:
  daml:
    name: dpm build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      # dpm is Digital Asset's Daml package manager. There is no official
      # published GitHub Action for it yet; the install step below uses the
      # same installer as the wormhole repo's canton/Dockerfile and pins the
      # SDK version declared in every daml.yaml (sdk-version: 3.5.1). The Daml
      # source builds against the vendored wormhole-core DAR — this job never
      # rebuilds core.
      - name: Install dpm
        run: |
          curl -fsSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Install SDK
        run: dpm install 3.5.1

      - name: Build all Canton packages
        run: dpm build --all

      - name: Run Daml tests
        working-directory: ./canton/test
        run: dpm test

  disclosure-service:
    name: disclosure service (go)
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ./canton/disclosure/service/go.mod
          cache-dependency-path: |
            ./canton/disclosure/service/go.sum
            ./canton/testing/go/go.sum

      - name: gofmt, vet, test (disclosure service)
        working-directory: ./canton/disclosure/service
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      # Unit tests only; the integration tests need the build tag "integration".
      - name: vet, test (testing/go)
        working-directory: ./canton/testing/go
        run: |
          go vet ./...
          go test -race -count=1 ./...

      # Builds and scans with the go.mod toolchain (go1.26.11).
      # Pin: the module checksum of golang.org/x/vuln v1.9.0 must equal GOVULNCHECK_MODULE_SUM.
      # sum.golang.org also verifies the download; no variable may exempt the module from it.
      # The go.sum inside that module pins the build dependencies of govulncheck.
      - name: govulncheck (disclosure service)
        working-directory: ./canton/disclosure/service
        env:
          GOVULNCHECK_MODULE: golang.org/x/vuln@v1.9.0
          GOVULNCHECK_MODULE_SUM: h1:12VaqnI9kJfqwRoPptxoqsUhQtdfrSbdksT7X/KY/sc=
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""
          GONOPROXY: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          downloaded_sum="$(cd "$RUNNER_TEMP" && go mod download -json "$GOVULNCHECK_MODULE" | jq -r .Sum)"
          test "$downloaded_sum" = "$GOVULNCHECK_MODULE_SUM"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_MODULE#*@}"
          "$(go env GOPATH)/bin/govulncheck" ./...
