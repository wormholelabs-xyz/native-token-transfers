# Multi-package project for the Canton NTT layer. The production package
# (`ntt`) builds against the vendored wormhole-core and CIP-56 interface DARs
# (see dars/README.md; core is consumed as a pinned artifact, never built
# here). The `ntt-test` package carries the Daml Scripts and depends on
# `ntt`. `dpm build --all` builds `ntt`, then `test`, in that order.
packages:
  - ./ntt
  - ./test
