# The uploadable Native Token Transfers (NTT) package: the NttManager and its
# Wormhole transceiver, the NttGovernance bootstrap root, the per-deployment
# LockedLedger, and the recipient DepositPreapproval, built on the
# wormhole-core primitives (publish via Emitter, parse/verify VAAs). Templates
# only, no daml-script, so it can be uploaded to a participant like
# wormhole-core.
#
# wormhole-core and token-cip0056 are data-dependencies, consumed as vendored
# DARs under ../dars (provenance in ../dars/README.md). The manager drives the
# CIP-56 token-standard interfaces (Holding, TransferFactory, BurnMintFactory)
# directly, but pins its canonical burn/mint factory to the token-cip0056
# CoinFactory template, so that package is a required dependency, not merely
# an interface implementer.
sdk-version: 3.5.1
name: ntt
version: 0.2.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  # Daml-LF 2.3 (Protocol Version 35), matching wormhole-core.
  - --target=2.3
data-dependencies:
  - ../dars/wormhole-core-0.5.0.dar
  - ../dars/token-cip0056-0.2.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-burn-mint-v1-1.0.0.dar
