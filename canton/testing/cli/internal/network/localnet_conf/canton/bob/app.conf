# Wormhole addition: the "bob" Canton participant, hosted inside the bundle's existing
# `canton` container alongside app-provider/app-user/sv (see localnet.go's
# ensureParticipantConfs and the plan's §2 port table). Mirrors
# conf/canton/app-user/app.conf's shape with literal ports substituted (bob has no
# prefix-based env-var convention of its own, since its host-port prefix "5" is new).
canton.participants.bob = ${_participant} {
  storage.config.properties.databaseName = participant-bob
  monitoring {
    http-health-server.port = 5900
    grpc-health-server.port = 5961
  }
  http-ledger-api.port = 5975
  admin-api.port = 5902
  ledger-api.port = 5901
}
