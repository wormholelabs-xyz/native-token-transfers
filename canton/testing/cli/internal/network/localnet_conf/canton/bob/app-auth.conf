# Wormhole addition: mirrors conf/canton/app-user/app-auth.conf -- same unsafe HS256 secret,
# same audience, same admin user id -- so the CLI's MintUnsafeToken/--access-token-file works
# unchanged against this participant too.
canton.participants.bob {
  ledger-api {
    auth-services = [{
      type = unsafe-jwt-hmac-256
      target-audience = "https://canton.network.global"
      secret = "unsafe"
    }]

    user-management-service.additional-admin-user-id = ledger-api-user
  }
}
