# Wormhole addition: the validator app fronting the "guardian-governance" participant --
# see splice/bob/app.conf for the pattern this mirrors. The validator-apps map key is
# abbreviated to "gg" (not "guardian-governance") because Canton rejects node names over 30
# characters, and "guardian-governance-validator_backend" (38 chars) exceeds that -- verified
# live (GENERIC_CONFIG_ERROR: "Node name is too long. Max length: 30."). The participant
# itself keeps the full "guardian-governance" name (20 chars, well under the limit); only
# this validator-app config key is shortened.
canton.validator-apps.gg-validator_backend = ${_validator_backend} {
  onboarding.secret = "guardian-governance-validator-onboarding-secret"
  storage.config.properties.databaseName = validator-guardian-governance
  admin-api.port = 6903
  participant-client {
    admin-api.port = 6902
    ledger-api.client-config.port = 6901
  }
  # Must match <organization>-<function>-<enumerator> where organization/function are pure
  # alphanumeric (no internal hyphens) -- verified live: "wormhole-guardian-governance-1"
  # fails with INVALID_ARGUMENT (an internal hyphen in "guardian-governance" splits it into
  # more than 3 segments). "gg" mirrors the validator-apps map key's own abbreviation.
  validator-party-hint = "wormhole-gg-1"

  domains.global.buy-extra-traffic {
    min-topup-interval = ${MIN_TRAFFIC_TOPUP_INTERVAL}
    target-throughput = ${TARGET_TRAFFIC_THROUGHPUT}
  }
}
