# Wormhole addition: mirrors splice/bob/app-auth.conf. Uses the "gg" abbreviated map key --
# see app.conf's comment (Canton rejects validator-apps node names over 30 characters).
canton.validator-apps.gg-validator_backend {
  participant-client.ledger-api.auth-config = {
    type = "self-signed"
    user = ledger-api-user
    audience = "https://canton.network.global"
    secret = "unsafe"
  }

  auth = {
    algorithm = "hs-256-unsafe"
    audience = "https://canton.network.global"
    secret = "unsafe"
  }

  ledger-api-user = ledger-api-user
  validator-wallet-users.0 = ledger-api-user
}
