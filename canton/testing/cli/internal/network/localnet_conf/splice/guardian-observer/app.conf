# Wormhole addition: the validator app fronting the "guardian-observer" participant --
# see splice/bob/app.conf for the pattern this mirrors. The validator-apps map key is
# abbreviated to "gobs" (not "guardian-observer") -- see splice/guardian-governance/app.conf's
# comment: Canton rejects validator-apps node names over 30 characters, and
# "guardian-observer-validator_backend" (36 chars) exceeds that. The participant itself
# keeps the full "guardian-observer" name (17 chars, well under the limit).
canton.validator-apps.gobs-validator_backend = ${_validator_backend} {
  onboarding.secret = "guardian-observer-validator-onboarding-secret"
  storage.config.properties.databaseName = validator-guardian-observer
  admin-api.port = 7903
  participant-client {
    admin-api.port = 7902
    ledger-api.client-config.port = 7901
  }
  # Must match <organization>-<function>-<enumerator> -- see
  # splice/guardian-governance/app.conf's comment (INVALID_ARGUMENT on internal hyphens,
  # verified live). "gobs" mirrors the validator-apps map key's own abbreviation.
  validator-party-hint = "wormhole-gobs-1"

  domains.global.buy-extra-traffic {
    min-topup-interval = ${MIN_TRAFFIC_TOPUP_INTERVAL}
    target-throughput = ${TARGET_TRAFFIC_THROUGHPUT}
  }
}
