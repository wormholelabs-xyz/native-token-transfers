# Wormhole addition: the validator app fronting the "bob" participant, hosted inside the
# bundle's existing `splice` container. Mirrors conf/splice/app-user/app.conf's shape --
# onboarding secret, database name, and participant-client pointed at bob's own
# ledger-api/admin-api ports (5901/5902), not the base template's defaults. A bare
# participant with no validator app has no synchronizer traffic and cannot onboard/submit
# (see conf/splice/app.conf's `_validator_backend` -- onboarding + buy-extra-traffic), so
# each new participant gets one, same as app-user's.
canton.validator-apps.bob-validator_backend = ${_validator_backend} {
  onboarding.secret = "bob-validator-onboarding-secret"
  storage.config.properties.databaseName = validator-bob
  admin-api.port = 5903
  participant-client {
    admin-api.port = 5902
    ledger-api.client-config.port = 5901
  }
  validator-party-hint = "wormhole-bob-1"

  domains.global.buy-extra-traffic {
    min-topup-interval = ${MIN_TRAFFIC_TOPUP_INTERVAL}
    target-throughput = ${TARGET_TRAFFIC_THROUGHPUT}
  }
}
