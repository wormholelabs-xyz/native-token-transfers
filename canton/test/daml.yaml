# Test package: Daml Scripts that exercise the NTT templates (unit tests via
# `dpm test`, and the live-sandbox integration entrypoints in Test.TestNtt).
# Kept separate from the production package so daml-script stays out of the
# uploadable NTT DAR.
#
# It data-depends on the vendored wormhole-core DAR plus the locally built ntt
# and ntt-disclosure DARs. The root multi-package.yaml ensures those are built
# first. `dpm build --all` packs their DALFs into this DAR too, so uploading
# it to a devnet sandbox makes the NTT + core packages available there.
sdk-version: 3.5.1
name: ntt-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
build-options:
  # Daml-LF 2.3 (Protocol Version 35), matching wormhole-core.
  - --target=2.3
  # Test.MockToken defines token templates that implement CIP-56 interfaces in
  # this daml-script-bearing test package (they must never ship in a production
  # DAR); uploading this DAR — devnet only — drags daml-script along, which is
  # acceptable there.
  - -Wno-template-interface-depends-on-daml-script
data-dependencies:
  - ../dars/wormhole-core-0.5.0.dar
  - ../dars/token-cip0056-0.2.0.dar
  - ../ntt/.daml/dist/ntt-0.2.0.dar
  - ../disclosure/.daml/dist/ntt-disclosure-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-burn-mint-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
